name: Bug Report
description: Report a bug in bino-plugin-sdk
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: SDK version
      description: "Version of `github.com/bino-bi/bino-plugin-sdk` (from go.mod)"
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: "Output of `go version`"
      placeholder: "go1.25.1 darwin/arm64"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Linux (ARM64)
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal plugin code or steps to reproduce the issue
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
